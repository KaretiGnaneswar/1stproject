<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portfolio & Services</title>
    <meta name="description" content="Professional portfolio showcasing web development, mobile apps, and consulting services">
    <meta name="keywords" content="web development, mobile apps, consulting, portfolio, professional services">
    <meta name="author" content="Kareti Gnaneswar">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        /* Custom styles */
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 0;
        }
        .service-card {
            transition: transform 0.3s ease;
            height: 100%;
        }
        .service-card:hover {
            transform: translateY(-10px);
        }
        .skill-badge {
            margin: 5px;
        }
        .footer {
            background-color: #2c3e50;
            color: white;
            padding: 40px 0 20px;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 500;
        }
        .section-padding {
            padding: 80px 0;
        }
        .text-gradient {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
